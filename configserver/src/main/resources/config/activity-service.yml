server:
  port: 8085

spring:
  data:
    mongodb:
      uri: mongodb://localhost:27017/FitnessActivity

  rabbitmq:
    host: localhost
    port: 5672   # <-- also fix this (see below)
    username: guest
    password: guest

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

rabbitmq:
  exchange:
    name: fitness.exchange
  queue:
    name: activity.queue
  routing:
    key: activity.tracking